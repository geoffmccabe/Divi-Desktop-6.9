name: Build apps (all platforms)

# The unattended, one-trigger build pipeline. Run it from the Actions tab
# ("Run workflow") or with:  gh workflow run build-apps.yml
#
# GitHub gives us a real machine for each OS, so every version is built
# NATIVELY — no cross-compilation. That is deliberately the whole point: cross
# compiling this old C++ core for Windows on Linux fought the toolchain at every
# step; a real Windows runner with a matched toolchain does not.
#
# Each job produces the installer for one platform and uploads it as an
# artifact you can download from the run. macOS is a single Universal build that
# runs on both Apple Silicon and Intel.
#
# NOTE: this builds the desktop APP. The node program (divid69) it downloads at
# first run is built and published separately; see build-daemons.yml (phase 2).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Universal)
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-22.04
            label: Linux (x86_64)
            args: ""
            rust-targets: ""
          - os: windows-latest
            label: Windows (x86_64)
            args: ""
            rust-targets: ""

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          if [ -n "${{ matrix.rust-targets }}" ]; then
            rustup target add ${{ matrix.rust-targets }}
          fi
        shell: bash

      # Cache the crate downloads AND the compiled dependency artifacts so each
      # build recompiles only OUR code, not the whole dependency tree — that
      # recompile was most of the ~5-7 min release build. First-party actions/cache
      # (not a third-party action) given this project's supply-chain history. Keyed
      # per-OS + Cargo.lock; the restore-key falls back to the newest cache when the
      # lock changes, so a dependency bump only recompiles what actually changed.
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      # Linux needs the webview + build libraries the desktop shell links against.
      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      # --ignore-scripts: install scripts are the exact supply-chain vector that
      # bit this project once. The frontend needs none of them.
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
        shell: bash

      # Strip developer paths out of the release binary (privacy) on the two
      # platforms where the compiler would otherwise embed them.
      - name: Set path-remap flags
        if: matrix.os != 'windows-latest'
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build" >> "$GITHUB_ENV"
        shell: bash

      # The cached target/ keeps the previous build's installer bundles, so
      # without this the artifact would carry stale old-version installers
      # alongside the new ones. Purge them; only dependency artifacts are worth
      # keeping in the cache, and those live elsewhere under target/.
      - name: Clear stale installers from the cache
        run: find target -type d -name bundle -prune -exec rm -rf {} + 2>/dev/null || true
        shell: bash

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/app
          args: ${{ matrix.args }}
        # Signs the updater artifacts with our private key (stored as a repo
        # secret, never in the tree). The app verifies every update against the
        # matching public key in tauri.conf.json, so a compromised download
        # server cannot push a different binary to anyone.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The .sig files are the signatures the in-app updater checks before it
      # installs anything, and the .tar.gz/.zip are the update payloads the
      # updater downloads (distinct from the human-facing installers). Without
      # these collected, the updater manifest can't be published.
      - name: Collect installers
        run: |
          mkdir -p out
          find target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
            -o -name '*.msi' -o -name '*-setup.exe' \
            -o -name '*.sig' -o -name '*.app.tar.gz' -o -name '*-setup.nsis.zip' \) \
            -exec cp {} out/ \; || true
          echo "collected:"; ls -1 out/
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: divi-desktop-${{ matrix.os }}
          path: out/*
          if-no-files-found: warn
