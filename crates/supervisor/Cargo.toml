[package]
name = "dd69-supervisor"
version = "0.1.0"
edition = "2021"
description = "Divi Desktop 6.9 node supervisor: runs, watches, safely stops, and recovers a divid full node"
license = "MIT"

[[bin]]
name = "dd69"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# The normative Divi overlay-record crates, vendored from the chain repo.
# See crates/name-registry/VENDORED.md and scripts/sync-divi-crates.sh.
dvxp-core = { path = "../dvxp-core" }
name-registry = { path = "../name-registry" }
# Token rules, record encoders, and the validate-before-send dry run.
dmt-indexer = { path = "../dmt-indexer" }
# The shared scanner. default-features = false on purpose: that drops the HTTP
# client and the read-API listener, leaving the rules and the query layer. The
# wallet drives them in-process from its OWN node connection, so a self-custody
# wallet never depends on a server we run to see tokens the chain agrees are
# theirs.
dvxp-scan = { path = "../dvxp-scan", default-features = false }
ureq = "2"
# Verifies the pinned checksum of the downloaded divid69 before it is installed.
sha2 = "0.10"
# Already in the tree via keyring; used directly for commit salts, which must
# come from a real CSPRNG rather than a hash of a timestamp.
getrandom = "0.2"
# Verifies community-app bundle signatures. Already in the tree via c2pa,
# so this adds no new download or new supply-chain surface.
ed25519-dalek = "2"
base64 = "0.22"
# NFD (Divi Collectibles) encryption core — audited RustCrypto primitives only.
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
# Collection import: unpack a Kinet.ink .zip bundle (deflate only; no exotic codecs).
zip = { version = "8", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
